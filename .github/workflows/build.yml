name: Build & Release (Tauri v2)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Release (AppImage, DEB, tar.gz)
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux Tauri dependencies
        run: |
          set -euo pipefail
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer || true
          if ! getent ahostsv4 archive.ubuntu.com >/dev/null 2>&1 || ! getent ahostsv4 mirrors.edge.kernel.org >/dev/null 2>&1; then
            echo "Default DNS lookup failed, configuring fallback DNS..."
            printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" | sudo tee /etc/resolv.conf >/dev/null
          fi
          MIRROR=""
          for candidate in \
            "https://mirrors.edge.kernel.org/ubuntu" \
            "http://archive.ubuntu.com/ubuntu" \
            "http://us.archive.ubuntu.com/ubuntu" \
            "http://azure.archive.ubuntu.com/ubuntu"; do
            if curl -4 -fsSLI --max-time 6 "${candidate}/dists/jammy/Release" >/dev/null 2>&1 && \
               curl -4 -fsSLI --max-time 6 "${candidate}/dists/jammy-security/Release" >/dev/null 2>&1; then
              MIRROR="$candidate"
              echo "Using Ubuntu mirror: $MIRROR"
              break
            fi
          done
          if [ -n "$MIRROR" ]; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf "%s\n" "$MIRROR" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            sudo sed -i -E "s|https?://([a-zA-Z0-9.-]*archive|security)\.ubuntu\.com/ubuntu|$MIRROR|g" /etc/apt/sources.list || true
          fi
          APT_OPTS=(-o Acquire::ForceIPv4=true -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=3 -o DPkg::Lock::Timeout=60)
          sudo timeout 180 apt-get update "${APT_OPTS[@]}"
          sudo timeout 300 env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get install -y --no-install-recommends "${APT_OPTS[@]}" \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libssl-dev \
            libgtk-3-dev \
            file \
            desktop-file-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Build Tauri Linux binary and bundles (DEB, AppImage, tar.gz)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-linux

          npx tauri build --no-bundle
          TAR_STAGE="release-linux/ciapongi-rp-launcher-${VERSION}"
          mkdir -p "$TAR_STAGE"
          cp src-tauri/target/release/ciapongi-rp-launcher "$TAR_STAGE/ciapongi-rp-launcher"
          chmod +x "$TAR_STAGE/ciapongi-rp-launcher"
          cp src-tauri/icons/128x128.png "$TAR_STAGE/ciapongi-rp-launcher.png"
          tar -czf "release-linux/ciapongi-rp-launcher-${VERSION}.tar.gz" -C release-linux "ciapongi-rp-launcher-${VERSION}"
          rm -rf "$TAR_STAGE"

          npx tauri build --bundles deb,appimage

          APPIMAGE_SRC=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -n 1)
          test -f "$APPIMAGE_SRC"
          cp "$APPIMAGE_SRC" "release-linux/CiapongiRPLauncher-${VERSION}.AppImage"
          chmod +x "release-linux/CiapongiRPLauncher-${VERSION}.AppImage"

          DEB_SRC=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' | head -n 1)
          test -f "$DEB_SRC"
          cp "$DEB_SRC" "release-linux/CiapongiRPLauncher_${VERSION}_amd64.deb"

          ls -lh release-linux/

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: release-linux/*

  build-windows:
    name: Build Windows Release (Setup EXE & Portable EXE)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Build Tauri Windows portable EXE and NSIS Setup
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path release-windows | Out-Null

          npx tauri build --no-bundle
          if ($LASTEXITCODE -ne 0) { throw "tauri build --no-bundle failed" }
          $portable = "src-tauri/target/release/ciapongi-rp-launcher.exe"
          if (-not (Test-Path $portable)) { throw "Missing standalone executable" }
          Copy-Item $portable "release-windows/CiapongiRPLauncher.$version.exe"

          npx tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "tauri build --bundles nsis failed" }
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $nsis) { throw "Missing NSIS setup installer" }
          Copy-Item $nsis.FullName "release-windows/CiapongiRPLauncher.Setup.$version.exe"

          Get-ChildItem release-windows

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: release-windows/*

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Extract CHANGELOG release notes for tag
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.removeprefix("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)", re.S | re.M)
          m = pattern.search(text)
          if m:
              body = f"## [{version}]\n" + m.group(1).strip() + "\n"
          else:
              body = f"## [{version}]\nWydanie CiapongiRP Launcher {version}.\n"
          Path("release_notes.md").write_text(body, encoding="utf-8")
          PY
          cat release_notes.md
          ls -lh release-assets/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber --repo "${{ github.repository }}"
            gh release edit "${GITHUB_REF_NAME}" --title "CiapongiRP Launcher ${GITHUB_REF_NAME}" --notes-file release_notes.md --latest --repo "${{ github.repository }}"
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --repo "${{ github.repository }}" \
              --title "CiapongiRP Launcher ${GITHUB_REF_NAME}" \
              --notes-file release_notes.md \
              --latest
          fi

