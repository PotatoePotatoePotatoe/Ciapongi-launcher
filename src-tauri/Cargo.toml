[package]
name = "ciapongi-rp-launcher"
version = "2.0.0"
description = "Ciapongi-RP Minecraft Launcher (Tauri v2 + Rust)"
authors = ["Ciapongi-RP <launcher@ciapongi.pl>"]
homepage = "https://ciapongi.szablix.pl"
repository = "https://github.com/PotatoePotatoePotatoe/Ciapongi-launcher"
edition = "2021"

[lib]
name = "ciapongi_rp_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["protocol-asset", "image-png", "devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "gzip"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
rayon = "1.10"
flate2 = "1.0"
tar = "0.4"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
sysinfo = "0.33"
urlencoding = "2.1"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

